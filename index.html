<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #090512;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .card {
            background: #130b24;
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .moon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #e9d5ff;
            margin-bottom: 0.25rem;
        }

        p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 2rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="moon">🌙</div>
        <h1>MOON CLUB</h1>
        <p>Nazuna Nanakusa Bot</p>

        <div class="status-badge">
            <span class="dot"></span>
            <span id="status">Despliegue activo</span>
        </div>
    </div>

</body>
</html>
